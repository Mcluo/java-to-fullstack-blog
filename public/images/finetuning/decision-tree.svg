<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="sh"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
  </defs>
  <rect width="800" height="480" fill="#f8fafc" rx="12"/>
  <text x="400" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">Prompt Engineering vs RAG vs Fine-tuning 选型决策</text>
  <!-- Start -->
  <rect x="280" y="50" width="240" height="40" rx="20" fill="#6366f1" filter="url(#sh)"/>
  <text x="400" y="76" text-anchor="middle" font-size="13" fill="white" font-weight="600">你的需求是什么？</text>
  <!-- Branch 1 -->
  <line x1="310" y1="90" x2="140" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="30" y="120" width="220" height="36" rx="8" fill="white" stroke="#e2e8f0" filter="url(#sh)"/>
  <text x="140" y="143" text-anchor="middle" font-size="11" fill="#475569">调整输出格式/风格？</text>
  <line x1="140" y1="156" x2="140" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="40" y="180" width="200" height="34" rx="8" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="140" y="202" text-anchor="middle" font-size="12" fill="#1d4ed8" font-weight="600">→ Prompt Engineering</text>
  <text x="140" y="228" text-anchor="middle" font-size="10" fill="#64748b">零成本，立即见效</text>
  <!-- Branch 2 -->
  <line x1="400" y1="90" x2="400" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="280" y="120" width="240" height="36" rx="8" fill="white" stroke="#e2e8f0" filter="url(#sh)"/>
  <text x="400" y="143" text-anchor="middle" font-size="11" fill="#475569">需要最新/私有知识？</text>
  <line x1="400" y1="156" x2="400" y2="180" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="300" y="180" width="200" height="34" rx="8" fill="#dcfce7" stroke="#86efac"/>
  <text x="400" y="202" text-anchor="middle" font-size="12" fill="#15803d" font-weight="600">→ RAG 检索增强</text>
  <text x="400" y="228" text-anchor="middle" font-size="10" fill="#64748b">知识可更新，无需重训</text>
  <!-- Branch 3 -->
  <line x1="490" y1="90" x2="660" y2="130" stroke="#94a3b8" stroke-width="1.5"/>
  <rect x="550" y="120" width="220" height="36" rx="8" fill="white" stroke="#e2e8f0" filter="url(#sh)"/>
  <text x="660" y="143" text-anchor="middle" font-size="11" fill="#475569">需要模型内化某种能力？</text>
  <!-- Sub branches -->
  <line x1="600" y1="156" x2="520" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="660" y1="156" x2="660" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="720" y1="156" x2="770" y2="190" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- < 100 -->
  <rect x="420" y="190" width="180" height="50" rx="8" fill="white" stroke="#e2e8f0" filter="url(#sh)"/>
  <text x="510" y="210" text-anchor="middle" font-size="10" fill="#475569">数据 &lt; 100 条</text>
  <text x="510" y="228" text-anchor="middle" font-size="11" fill="#6366f1" font-weight="600">→ Few-shot Prompting</text>
  <!-- 100-10000 -->
  <rect x="570" y="190" width="180" height="50" rx="8" fill="#fef3c7" stroke="#fcd34d"/>
  <text x="660" y="210" text-anchor="middle" font-size="10" fill="#475569">100~10000 条</text>
  <text x="660" y="228" text-anchor="middle" font-size="11" fill="#d97706" font-weight="700">→ LoRA / QLoRA ★</text>
  <!-- > 10000 -->
  <rect x="690" y="260" width="100" height="40" rx="8" fill="white" stroke="#e2e8f0" filter="url(#sh)"/>
  <text x="740" y="277" text-anchor="middle" font-size="10" fill="#475569">&gt; 10000 条</text>
  <text x="740" y="293" text-anchor="middle" font-size="10" fill="#ef4444">全量微调</text>
  <line x1="770" y1="190" x2="740" y2="260" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Best practice -->
  <rect x="150" y="310" width="500" height="70" rx="12" fill="white" stroke="#6366f1" stroke-width="2" filter="url(#sh)"/>
  <text x="400" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#4f46e5">最佳实践：三者组合</text>
  <text x="400" y="358" text-anchor="middle" font-size="12" fill="#64748b">微调（内化格式+领域知识） + RAG（补充实时知识） + Prompt（控制行为）</text>
  <!-- Arrows to best practice -->
  <line x1="140" y1="228" x2="280" y2="310" stroke="#6366f1" stroke-width="1" stroke-dasharray="4"/>
  <line x1="400" y1="228" x2="400" y2="310" stroke="#6366f1" stroke-width="1" stroke-dasharray="4"/>
  <line x1="660" y1="240" x2="520" y2="310" stroke="#6366f1" stroke-width="1" stroke-dasharray="4"/>
  <!-- Pipeline -->
  <rect x="100" y="410" width="130" height="40" rx="8" fill="#dbeafe"/>
  <text x="165" y="435" text-anchor="middle" font-size="11" fill="#1d4ed8">Prompt 构建</text>
  <text x="250" y="435" text-anchor="middle" font-size="16" fill="#94a3b8">→</text>
  <rect x="270" y="410" width="130" height="40" rx="8" fill="#dcfce7"/>
  <text x="335" y="435" text-anchor="middle" font-size="11" fill="#15803d">RAG 检索</text>
  <text x="420" y="435" text-anchor="middle" font-size="16" fill="#94a3b8">→</text>
  <rect x="440" y="410" width="130" height="40" rx="8" fill="#fef3c7"/>
  <text x="505" y="435" text-anchor="middle" font-size="11" fill="#d97706">微调模型推理</text>
  <text x="590" y="435" text-anchor="middle" font-size="16" fill="#94a3b8">→</text>
  <rect x="610" y="410" width="130" height="40" rx="8" fill="#f0fdf4" stroke="#86efac"/>
  <text x="675" y="435" text-anchor="middle" font-size="11" fill="#15803d" font-weight="600">高质量输出</text>
</svg>
