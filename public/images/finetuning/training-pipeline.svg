<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <filter id="sd"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/></filter>
    <linearGradient id="b1" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#818cf8"/></linearGradient>
    <linearGradient id="b2" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#60a5fa"/></linearGradient>
    <linearGradient id="b3" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="b4" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#10b981"/><stop offset="100%" stop-color="#34d399"/></linearGradient>
  </defs>
  <rect width="800" height="320" fill="#f8fafc" rx="12"/>
  <text x="400" y="30" text-anchor="middle" font-size="17" font-weight="700" fill="#1e293b">LoRA/QLoRA 训练流程</text>
  <!-- Step 1 -->
  <rect x="20" y="55" width="170" height="100" rx="10" fill="white" stroke="#e2e8f0" filter="url(#sd)"/>
  <rect x="20" y="55" width="170" height="30" rx="10" fill="url(#b1)"/>
  <text x="105" y="75" text-anchor="middle" font-size="11" fill="white" font-weight="600">1. 加载基座模型</text>
  <text x="105" y="100" text-anchor="middle" font-size="10" fill="#64748b">Qwen2.5-7B</text>
  <text x="105" y="118" text-anchor="middle" font-size="10" fill="#64748b">4-bit 量化加载</text>
  <text x="105" y="140" text-anchor="middle" font-size="16">🤖</text>
  <text x="198" y="105" font-size="18" fill="#94a3b8">→</text>
  <!-- Step 2 -->
  <rect x="215" y="55" width="170" height="100" rx="10" fill="white" stroke="#e2e8f0" filter="url(#sd)"/>
  <rect x="215" y="55" width="170" height="30" rx="10" fill="url(#b2)"/>
  <text x="300" y="75" text-anchor="middle" font-size="11" fill="white" font-weight="600">2. 配置 LoRA</text>
  <text x="300" y="100" text-anchor="middle" font-size="10" fill="#64748b">r=16, alpha=32</text>
  <text x="300" y="118" text-anchor="middle" font-size="10" fill="#64748b">target: qkv + ffn</text>
  <text x="300" y="140" text-anchor="middle" font-size="16">⚙️</text>
  <text x="393" y="105" font-size="18" fill="#94a3b8">→</text>
  <!-- Step 3 -->
  <rect x="410" y="55" width="170" height="100" rx="10" fill="white" stroke="#e2e8f0" filter="url(#sd)"/>
  <rect x="410" y="55" width="170" height="30" rx="10" fill="url(#b3)"/>
  <text x="495" y="75" text-anchor="middle" font-size="11" fill="white" font-weight="600">3. 训练</text>
  <text x="495" y="100" text-anchor="middle" font-size="10" fill="#64748b">lr=2e-4, epochs=3</text>
  <text x="495" y="118" text-anchor="middle" font-size="10" fill="#64748b">cosine scheduler</text>
  <text x="495" y="140" text-anchor="middle" font-size="16">🏋️</text>
  <text x="588" y="105" font-size="18" fill="#94a3b8">→</text>
  <!-- Step 4 -->
  <rect x="605" y="55" width="170" height="100" rx="10" fill="white" stroke="#e2e8f0" filter="url(#sd)"/>
  <rect x="605" y="55" width="170" height="30" rx="10" fill="url(#b4)"/>
  <text x="690" y="75" text-anchor="middle" font-size="11" fill="white" font-weight="600">4. 评估 + 合并</text>
  <text x="690" y="100" text-anchor="middle" font-size="10" fill="#64748b">eval_loss / 人工评测</text>
  <text x="690" y="118" text-anchor="middle" font-size="10" fill="#64748b">merge_and_unload()</text>
  <text x="690" y="140" text-anchor="middle" font-size="16">✅</text>
  <!-- Bottom: Data flow -->
  <rect x="20" y="185" width="755" height="120" rx="10" fill="white" stroke="#e2e8f0" filter="url(#sd)"/>
  <text x="400" y="210" text-anchor="middle" font-size="13" font-weight="600" fill="#475569">关键组件</text>
  <!-- Components -->
  <rect x="40" y="225" width="140" height="60" rx="8" fill="#f1f5f9"/>
  <text x="110" y="250" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">训练数据</text>
  <text x="110" y="270" text-anchor="middle" font-size="10" fill="#94a3b8">ChatML 对话格式</text>
  <rect x="200" y="225" width="140" height="60" rx="8" fill="#f1f5f9"/>
  <text x="270" y="250" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">PEFT 库</text>
  <text x="270" y="270" text-anchor="middle" font-size="10" fill="#94a3b8">LoRA / QLoRA 实现</text>
  <rect x="360" y="225" width="140" height="60" rx="8" fill="#f1f5f9"/>
  <text x="430" y="250" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">SFTTrainer</text>
  <text x="430" y="270" text-anchor="middle" font-size="10" fill="#94a3b8">HuggingFace TRL</text>
  <rect x="520" y="225" width="140" height="60" rx="8" fill="#f1f5f9"/>
  <text x="590" y="250" text-anchor="middle" font-size="11" fill="#475569" font-weight="600">WandB</text>
  <text x="590" y="270" text-anchor="middle" font-size="10" fill="#94a3b8">训练监控</text>
  <rect x="680" y="225" width="80" height="60" rx="8" fill="#fef3c7"/>
  <text x="720" y="250" text-anchor="middle" font-size="11" fill="#d97706" font-weight="600">GPU</text>
  <text x="720" y="270" text-anchor="middle" font-size="10" fill="#94a3b8">≥6GB</text>
</svg>
