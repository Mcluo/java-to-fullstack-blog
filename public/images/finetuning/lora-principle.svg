<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" font-family="system-ui,-apple-system,sans-serif">
  <defs>
    <linearGradient id="frozen" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#94a3b8"/><stop offset="100%" stop-color="#cbd5e1"/></linearGradient>
    <linearGradient id="trainA" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#fbbf24"/></linearGradient>
    <linearGradient id="trainB" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#ef4444"/><stop offset="100%" stop-color="#f87171"/></linearGradient>
    <filter id="s"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.1"/></filter>
  </defs>
  <rect width="800" height="380" fill="#f8fafc" rx="12"/>
  <text x="400" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1e293b">LoRA 原理：低秩分解</text>
  <!-- Left: Full Fine-tuning -->
  <text x="180" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#64748b">全量微调</text>
  <rect x="60" y="80" width="240" height="160" rx="10" fill="url(#trainB)" filter="url(#s)" opacity="0.9"/>
  <text x="180" y="140" text-anchor="middle" font-size="13" fill="white" font-weight="600">W (原始权重)</text>
  <text x="180" y="165" text-anchor="middle" font-size="12" fill="white">4096 x 4096</text>
  <text x="180" y="190" text-anchor="middle" font-size="11" fill="white" opacity="0.9">全部参数可训练</text>
  <text x="180" y="215" text-anchor="middle" font-size="11" fill="white" opacity="0.9">~16M 参数/层</text>
  <rect x="90" y="255" width="180" height="36" rx="8" fill="#fef2f2" stroke="#fca5a5"/>
  <text x="180" y="278" text-anchor="middle" font-size="12" fill="#dc2626">y = W'x</text>
  <text x="180" y="310" text-anchor="middle" font-size="11" fill="#ef4444">需要 ~80GB 显存 (7B)</text>
  <text x="180" y="330" text-anchor="middle" font-size="24">😰</text>
  <!-- VS -->
  <text x="400" y="170" text-anchor="middle" font-size="28" font-weight="700" fill="#cbd5e1">VS</text>
  <!-- Right: LoRA -->
  <text x="610" y="66" text-anchor="middle" font-size="14" font-weight="600" fill="#3b82f6">LoRA 微调</text>
  <!-- Frozen W -->
  <rect x="490" y="80" width="120" height="100" rx="8" fill="url(#frozen)" filter="url(#s)"/>
  <text x="550" y="118" text-anchor="middle" font-size="12" fill="white" font-weight="600">W (冻结)</text>
  <text x="550" y="138" text-anchor="middle" font-size="10" fill="white">4096 x 4096</text>
  <text x="550" y="156" text-anchor="middle" font-size="10" fill="white">🔒 不训练</text>
  <!-- Plus sign -->
  <text x="620" y="135" text-anchor="middle" font-size="22" font-weight="700" fill="#64748b">+</text>
  <!-- B matrix -->
  <rect x="640" y="80" width="50" height="100" rx="6" fill="url(#trainB)" filter="url(#s)"/>
  <text x="665" y="118" text-anchor="middle" font-size="10" fill="white" font-weight="600">B</text>
  <text x="665" y="136" text-anchor="middle" font-size="9" fill="white">4096</text>
  <text x="665" y="150" text-anchor="middle" font-size="9" fill="white">x r</text>
  <!-- A matrix -->
  <rect x="700" y="105" width="80" height="50" rx="6" fill="url(#trainA)" filter="url(#s)"/>
  <text x="740" y="128" text-anchor="middle" font-size="10" fill="white" font-weight="600">A</text>
  <text x="740" y="145" text-anchor="middle" font-size="9" fill="white">r x 4096</text>
  <!-- r label -->
  <rect x="668" y="190" width="40" height="22" rx="6" fill="#dbeafe"/>
  <text x="688" y="206" text-anchor="middle" font-size="11" fill="#2563eb" font-weight="600">r=16</text>
  <!-- Formula -->
  <rect x="500" y="225" width="260" height="36" rx="8" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="630" y="248" text-anchor="middle" font-size="12" fill="#1d4ed8">y = Wx + BAx</text>
  <!-- Stats -->
  <text x="630" y="285" text-anchor="middle" font-size="11" fill="#3b82f6">可训练参数: ~131K/层 (0.8%)</text>
  <text x="630" y="305" text-anchor="middle" font-size="11" fill="#3b82f6">需要 ~6GB 显存 (QLoRA)</text>
  <text x="630" y="330" text-anchor="middle" font-size="24">🎉</text>
  <!-- Legend -->
  <rect x="240" y="350" width="12" height="12" rx="3" fill="#94a3b8"/>
  <text x="258" y="361" font-size="11" fill="#64748b">冻结参数</text>
  <rect x="340" y="350" width="12" height="12" rx="3" fill="#ef4444"/>
  <text x="358" y="361" font-size="11" fill="#64748b">B 矩阵 (可训练)</text>
  <rect x="470" y="350" width="12" height="12" rx="3" fill="#f59e0b"/>
  <text x="488" y="361" font-size="11" fill="#64748b">A 矩阵 (可训练)</text>
</svg>
