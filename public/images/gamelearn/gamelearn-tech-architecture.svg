<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 640" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000012"/>
    </filter>
    <linearGradient id="gBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6"/>
      <stop offset="100%" style="stop-color:#6366F1"/>
    </linearGradient>
    <linearGradient id="gGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#34D399"/>
    </linearGradient>
    <linearGradient id="gOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#9CA3AF"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366F1"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="640" fill="#FAFBFC" rx="12"/>

  <!-- Title -->
  <text x="460" y="35" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">GameLearn Engine 技术架构</text>
  <text x="460" y="55" text-anchor="middle" font-size="11" fill="#9CA3AF">Next.js 14 · Claude Sonnet 4.6 · 模板注入 · SSE 流式</text>

  <!-- ============ User Layer ============ -->
  <rect x="340" y="72" width="240" height="50" rx="25" fill="url(#gBlue)" filter="url(#shadow)"/>
  <text x="460" y="102" text-anchor="middle" font-size="13" font-weight="700" fill="white">用户输入教育文本</text>

  <!-- Arrow down -->
  <line x1="460" y1="122" x2="460" y2="148" stroke="#6366F1" stroke-width="2" marker-end="url(#arrowBlue)"/>

  <!-- ============ Frontend Layer ============ -->
  <rect x="30" y="148" width="860" height="130" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="50" y="172" font-size="11" font-weight="600" fill="#4F46E5" letter-spacing="1.5">FRONTEND (React + Tailwind)</text>

  <!-- Frontend components -->
  <rect x="50" y="185" width="180" height="75" rx="8" fill="white" stroke="#A5B4FC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="140" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#4338CA">PlaygroundForm</text>
  <text x="140" y="228" text-anchor="middle" font-size="9" fill="#6B7280">文本输入 · 类型选择</text>
  <text x="140" y="244" text-anchor="middle" font-size="9" fill="#6B7280">语言切换 · 示例文本</text>

  <rect x="255" y="185" width="180" height="75" rx="8" fill="white" stroke="#A5B4FC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="345" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#4338CA">PipelineProgress</text>
  <text x="345" y="228" text-anchor="middle" font-size="9" fill="#6B7280">SSE 事件消费</text>
  <text x="345" y="244" text-anchor="middle" font-size="9" fill="#6B7280">6 步实时进度条</text>

  <rect x="460" y="185" width="180" height="75" rx="8" fill="white" stroke="#A5B4FC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="550" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#4338CA">GamePreview</text>
  <text x="550" y="228" text-anchor="middle" font-size="9" fill="#6B7280">sandbox iframe</text>
  <text x="550" y="244" text-anchor="middle" font-size="9" fill="#6B7280">全屏 · 下载 HTML</text>

  <rect x="665" y="185" width="210" height="75" rx="8" fill="white" stroke="#A5B4FC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="770" y="210" text-anchor="middle" font-size="12" font-weight="600" fill="#4338CA">I18nProvider</text>
  <text x="770" y="228" text-anchor="middle" font-size="9" fill="#6B7280">中文 / English 切换</text>
  <text x="770" y="244" text-anchor="middle" font-size="9" fill="#6B7280">60+ 翻译条目 · localStorage</text>

  <!-- Arrow: Frontend → API -->
  <line x1="140" y1="260" x2="140" y2="305" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="155" y="288" font-size="9" fill="#6366F1" font-weight="500">POST /api/generate</text>
  <line x1="345" y1="260" x2="345" y2="305" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="360" y="288" font-size="9" fill="#6366F1" font-weight="500">SSE stream ←</text>

  <!-- ============ API Layer ============ -->
  <rect x="30" y="305" width="860" height="85" rx="12" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1.5"/>
  <text x="50" y="328" font-size="11" font-weight="600" fill="#16A34A" letter-spacing="1.5">API ROUTES (Next.js)</text>

  <rect x="50" y="342" width="240" height="36" rx="8" fill="white" stroke="#86EFAC" stroke-width="1.5" filter="url(#shadow)"/>
  <text x="170" y="365" text-anchor="middle" font-size="11" font-weight="600" fill="#166534">POST /api/generate</text>

  <rect x="310" y="342" width="200" height="36" rx="8" fill="white" stroke="#86EFAC" stroke-width="1"/>
  <text x="410" y="365" text-anchor="middle" font-size="11" fill="#166534">GET /api/games</text>

  <rect x="530" y="342" width="240" height="36" rx="8" fill="white" stroke="#86EFAC" stroke-width="1"/>
  <text x="650" y="365" text-anchor="middle" font-size="11" fill="#166534">GET|DELETE /api/games/[id]</text>

  <!-- Arrow: API → Pipeline -->
  <line x1="170" y1="378" x2="170" y2="418" stroke="#16A34A" stroke-width="2" marker-end="url(#arrowGray)"/>

  <!-- ============ Pipeline Core ============ -->
  <rect x="30" y="418" width="620" height="100" rx="12" fill="#FFF7ED" stroke="#FED7AA" stroke-width="1.5"/>
  <text x="50" y="440" font-size="11" font-weight="600" fill="#C2410C" letter-spacing="1.5">AI PIPELINE (pipeline.ts)</text>

  <!-- Pipeline steps as flow -->
  <rect x="50" y="455" width="80" height="48" rx="6" fill="white" stroke="#FDBA7440" stroke-width="1"/>
  <text x="90" y="475" text-anchor="middle" font-size="10" font-weight="600" fill="#C2410C">分析</text>
  <text x="90" y="490" text-anchor="middle" font-size="8" fill="#9CA3AF">Claude</text>

  <line x1="130" y1="479" x2="148" y2="479" stroke="#FDBA74" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="148" y="455" width="80" height="48" rx="6" fill="white" stroke="#FDBA7440" stroke-width="1"/>
  <text x="188" y="475" text-anchor="middle" font-size="10" font-weight="600" fill="#C2410C">设计</text>
  <text x="188" y="490" text-anchor="middle" font-size="8" fill="#9CA3AF">Claude</text>

  <line x1="228" y1="479" x2="246" y2="479" stroke="#FDBA74" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="246" y="455" width="80" height="48" rx="6" fill="white" stroke="#FDBA7440" stroke-width="1"/>
  <text x="286" y="475" text-anchor="middle" font-size="10" font-weight="600" fill="#C2410C">内容</text>
  <text x="286" y="490" text-anchor="middle" font-size="8" fill="#9CA3AF">Claude</text>

  <line x1="326" y1="479" x2="344" y2="479" stroke="#FDBA74" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="344" y="455" width="80" height="48" rx="6" fill="#4F46E5" stroke="#4F46E5" stroke-width="1.5"/>
  <text x="384" y="475" text-anchor="middle" font-size="10" font-weight="600" fill="white">组装</text>
  <text x="384" y="490" text-anchor="middle" font-size="8" fill="#C7D2FE">模板注入</text>

  <line x1="424" y1="479" x2="442" y2="479" stroke="#FDBA74" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="442" y="455" width="80" height="48" rx="6" fill="white" stroke="#FDBA7440" stroke-width="1"/>
  <text x="482" y="475" text-anchor="middle" font-size="10" font-weight="600" fill="#C2410C">验证</text>
  <text x="482" y="490" text-anchor="middle" font-size="8" fill="#9CA3AF">本地</text>

  <line x1="522" y1="479" x2="540" y2="479" stroke="#FDBA74" stroke-width="1.5" marker-end="url(#arrowGray)"/>

  <rect x="540" y="455" width="80" height="48" rx="6" fill="white" stroke="#16A34A" stroke-width="1.5"/>
  <text x="580" y="475" text-anchor="middle" font-size="10" font-weight="600" fill="#16A34A">存储</text>
  <text x="580" y="490" text-anchor="middle" font-size="8" fill="#9CA3AF">文件系统</text>

  <!-- ============ External: Claude API ============ -->
  <rect x="680" y="418" width="210" height="100" rx="12" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.5"/>
  <text x="785" y="440" text-anchor="middle" font-size="11" font-weight="600" fill="#7C3AED" letter-spacing="1">CLAUDE API</text>
  <rect x="700" y="452" width="170" height="26" rx="6" fill="white" stroke="#C4B5FD" stroke-width="1"/>
  <text x="785" y="470" text-anchor="middle" font-size="10" fill="#7C3AED">claude-sonnet-4-6</text>
  <text x="785" y="492" text-anchor="middle" font-size="9" fill="#9CA3AF">3 次调用 / 生成</text>
  <text x="785" y="506" text-anchor="middle" font-size="9" fill="#9CA3AF">~$0.10-0.15 / 次</text>

  <!-- Arrow: Pipeline → Claude -->
  <line x1="326" y1="455" x2="690" y2="440" stroke="#7C3AED40" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- ============ Storage Layer ============ -->
  <rect x="30" y="545" width="860" height="80" rx="12" fill="#F9FAFB" stroke="#E5E7EB" stroke-width="1.5"/>
  <text x="50" y="568" font-size="11" font-weight="600" fill="#6B7280" letter-spacing="1.5">STORAGE</text>

  <rect x="50" y="580" width="260" height="32" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1" filter="url(#shadow)"/>
  <text x="60" y="601" font-size="11" fill="#374151">📁 public/games/{id}.html</text>
  <text x="280" y="601" text-anchor="end" font-size="9" fill="#9CA3AF">自包含游戏</text>

  <rect x="335" y="580" width="260" height="32" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1" filter="url(#shadow)"/>
  <text x="345" y="601" font-size="11" fill="#374151">📋 data/games-index.json</text>
  <text x="565" y="601" text-anchor="end" font-size="9" fill="#9CA3AF">元数据索引</text>

  <rect x="620" y="580" width="255" height="32" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1" filter="url(#shadow)"/>
  <text x="630" y="601" font-size="11" fill="#374151">🎮 Quiz 模板 (quiz.ts)</text>
  <text x="845" y="601" text-anchor="end" font-size="9" fill="#9CA3AF">CSS 像素风 · 音效</text>

  <!-- Arrow: Pipeline → Storage -->
  <line x1="580" y1="503" x2="180" y2="580" stroke="#9CA3AF" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>
