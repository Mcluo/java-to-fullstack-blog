<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow1" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="400" y="28" text-anchor="middle" font-size="16" font-weight="bold" fill="#1e293b">改造前：纯 Prompt 硬编码</text>

  <!-- User -->
  <rect x="30" y="70" width="140" height="60" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="100" y="97" text-anchor="middle" font-size="13" fill="#1e40af" font-weight="600">用户提问</text>
  <text x="100" y="115" text-anchor="middle" font-size="11" fill="#3b82f6">"TS和Java区别？"</text>

  <!-- Arrow 1 -->
  <line x1="170" y1="100" x2="240" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- System Prompt -->
  <rect x="250" y="55" width="200" height="90" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="82" text-anchor="middle" font-size="13" fill="#92400e" font-weight="600">System Prompt</text>
  <text x="350" y="100" text-anchor="middle" font-size="11" fill="#b45309">硬编码文章目录</text>
  <text x="350" y="116" text-anchor="middle" font-size="10" fill="#d97706">❌ 不知道文章内容</text>
  <text x="350" y="132" text-anchor="middle" font-size="10" fill="#d97706">❌ 新增文章需改代码</text>

  <!-- Arrow 2 -->
  <line x1="450" y1="100" x2="520" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Claude -->
  <rect x="530" y="70" width="120" height="60" rx="12" fill="#e0e7ff" stroke="#6366f1" stroke-width="2"/>
  <text x="590" y="97" text-anchor="middle" font-size="13" fill="#4338ca" font-weight="600">Claude API</text>
  <text x="590" y="115" text-anchor="middle" font-size="11" fill="#6366f1">通用知识回答</text>

  <!-- Arrow 3 -->
  <line x1="650" y1="100" x2="700" y2="100" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow1)"/>

  <!-- Output -->
  <rect x="710" y="70" width="70" height="60" rx="12" fill="#fecaca" stroke="#ef4444" stroke-width="2"/>
  <text x="745" y="97" text-anchor="middle" font-size="13" fill="#991b1b" font-weight="600">回答</text>
  <text x="745" y="115" text-anchor="middle" font-size="10" fill="#dc2626">❌ 无来源</text>
</svg>
