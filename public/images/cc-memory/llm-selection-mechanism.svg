<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="Inter, -apple-system, sans-serif">
  <defs>
    <filter id="sh" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#00000010"/>
    </filter>
    <marker id="a1" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4F46E5"/>
    </marker>
    <marker id="a2" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#16A34A"/>
    </marker>
    <marker id="a3" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#DC2626"/>
    </marker>
  </defs>

  <rect width="900" height="500" fill="#FAFBFC" rx="12"/>
  <text x="450" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1F2937">LLM Memory Selection Mechanism (memdir_relevance)</text>
  <text x="450" y="50" text-anchor="middle" font-size="11" fill="#9CA3AF">How Claude Code decides which memories to load</text>

  <!-- Left: Input -->
  <rect x="30" y="70" width="250" height="400" rx="10" fill="#F0F9FF" stroke="#BAE6FD" stroke-width="1"/>
  <text x="155" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#0369A1">Input: Memory Directory</text>

  <!-- Memory files -->
  <rect x="45" y="110" width="220" height="50" rx="6" fill="white" stroke="#7DD3FC" stroke-width="1" filter="url(#sh)"/>
  <text x="55" y="130" font-size="9" font-weight="600" fill="#0C4A6E">feedback_testing.md</text>
  <text x="55" y="145" font-size="8" fill="#6B7280">desc: integration tests must hit real DB</text>

  <rect x="45" y="170" width="220" height="50" rx="6" fill="white" stroke="#7DD3FC" stroke-width="1" filter="url(#sh)"/>
  <text x="55" y="190" font-size="9" font-weight="600" fill="#0C4A6E">user_role.md</text>
  <text x="55" y="205" font-size="8" fill="#6B7280">desc: senior Java dev, new to React</text>

  <rect x="45" y="230" width="220" height="50" rx="6" fill="white" stroke="#7DD3FC" stroke-width="1" filter="url(#sh)"/>
  <text x="55" y="250" font-size="9" font-weight="600" fill="#0C4A6E">project_auth_rewrite.md</text>
  <text x="55" y="265" font-size="8" fill="#6B7280">desc: auth middleware rewrite for compliance</text>

  <rect x="45" y="290" width="220" height="50" rx="6" fill="white" stroke="#7DD3FC" stroke-width="1" filter="url(#sh)"/>
  <text x="55" y="310" font-size="9" font-weight="600" fill="#0C4A6E">reference_linear.md</text>
  <text x="55" y="325" font-size="8" fill="#6B7280">desc: pipeline bugs tracked in Linear INGEST</text>

  <rect x="45" y="350" width="220" height="50" rx="6" fill="white" stroke="#7DD3FC" stroke-width="1" filter="url(#sh)"/>
  <text x="55" y="370" font-size="9" font-weight="600" fill="#0C4A6E">feedback_pr_style.md</text>
  <text x="55" y="385" font-size="8" fill="#6B7280">desc: prefer bundled PRs for refactors</text>

  <text x="155" y="425" text-anchor="middle" font-size="10" fill="#6B7280">... + N more files</text>
  <rect x="80" y="435" width="150" height="25" rx="4" fill="#DBEAFE"/>
  <text x="155" y="452" text-anchor="middle" font-size="9" font-weight="600" fill="#1E40AF">Only name + description sent</text>

  <!-- Center: LLM Processing -->
  <rect x="310" y="70" width="280" height="400" rx="10" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1.5"/>
  <text x="450" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#4338CA">LLM Selection Engine</text>

  <!-- System Prompt -->
  <rect x="325" y="110" width="250" height="85" rx="8" fill="#4F46E5" filter="url(#sh)"/>
  <text x="450" y="132" text-anchor="middle" font-size="11" font-weight="700" fill="white">System Prompt (TOY)</text>
  <text x="335" y="150" font-size="8" fill="#C7D2FE">"You are selecting memories that will</text>
  <text x="335" y="162" font-size="8" fill="#C7D2FE">be useful to Claude Code... Return a list</text>
  <text x="335" y="174" font-size="8" fill="#C7D2FE">of filenames (up to 5). Be selective."</text>
  <text x="335" y="188" font-size="8" fill="#A5B4FC">Model: LT() (lightweight, fast)</text>

  <!-- Message 1: File list -->
  <rect x="325" y="205" width="250" height="55" rx="8" fill="white" stroke="#A5B4FC" stroke-width="1" filter="url(#sh)"/>
  <text x="335" y="225" font-size="9" font-weight="600" fill="#4338CA">Message 1 (cached):</text>
  <text x="335" y="240" font-size="8" fill="#6B7280">Available memories:</text>
  <text x="335" y="252" font-size="8" fill="#6B7280">- feedback_testing.md: integration tests...</text>

  <!-- Message 2: User query -->
  <rect x="325" y="270" width="250" height="45" rx="8" fill="white" stroke="#A5B4FC" stroke-width="1" filter="url(#sh)"/>
  <text x="335" y="290" font-size="9" font-weight="600" fill="#4338CA">Message 2 (current query):</text>
  <text x="335" y="305" font-size="8" fill="#6B7280">"Select memories relevant to: fix auth bug"</text>

  <!-- Output -->
  <rect x="325" y="330" width="250" height="55" rx="8" fill="#ECFDF5" stroke="#6EE7B7" stroke-width="1.5" filter="url(#sh)"/>
  <text x="335" y="350" font-size="9" font-weight="700" fill="#065F46">JSON Output (max_tokens: 256):</text>
  <text x="335" y="368" font-size="9" fill="#059669" font-family="monospace">{"selected_memories":</text>
  <text x="345" y="380" font-size="9" fill="#059669" font-family="monospace">["project_auth_rewrite.md"]}</text>

  <!-- Conversation caching -->
  <rect x="325" y="400" width="250" height="55" rx="8" fill="#FEF3C7" stroke="#FCD34D" stroke-width="1" filter="url(#sh)"/>
  <text x="450" y="420" text-anchor="middle" font-size="10" font-weight="600" fill="#92400E">Conversation Caching</text>
  <text x="335" y="436" font-size="8" fill="#6B7280">Prior Q&amp;A pairs are appended to messages</text>
  <text x="335" y="448" font-size="8" fill="#6B7280">→ avoids re-selecting same memories</text>

  <!-- Right: Result -->
  <rect x="620" y="70" width="250" height="400" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
  <text x="745" y="95" text-anchor="middle" font-size="12" font-weight="700" fill="#16A34A">Output: Loaded Memories</text>

  <!-- Selected -->
  <rect x="635" y="115" width="220" height="60" rx="8" fill="#16A34A" filter="url(#sh)"/>
  <text x="745" y="140" text-anchor="middle" font-size="11" font-weight="700" fill="white">project_auth_rewrite.md</text>
  <text x="745" y="158" text-anchor="middle" font-size="9" fill="#BBF7D0">SELECTED - Full content loaded</text>

  <!-- Not selected -->
  <rect x="635" y="190" width="220" height="45" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1" opacity="0.5"/>
  <text x="745" y="212" text-anchor="middle" font-size="10" fill="#D1D5DB">feedback_testing.md</text>
  <text x="745" y="226" text-anchor="middle" font-size="8" fill="#D1D5DB">NOT selected - not relevant</text>

  <rect x="635" y="245" width="220" height="45" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1" opacity="0.5"/>
  <text x="745" y="267" text-anchor="middle" font-size="10" fill="#D1D5DB">user_role.md</text>
  <text x="745" y="281" text-anchor="middle" font-size="8" fill="#D1D5DB">NOT selected - conservative on [user]</text>

  <rect x="635" y="300" width="220" height="45" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1" opacity="0.5"/>
  <text x="745" y="322" text-anchor="middle" font-size="10" fill="#D1D5DB">reference_linear.md</text>
  <text x="745" y="336" text-anchor="middle" font-size="8" fill="#D1D5DB">NOT selected</text>

  <rect x="635" y="355" width="220" height="45" rx="6" fill="white" stroke="#E5E7EB" stroke-width="1" opacity="0.5"/>
  <text x="745" y="377" text-anchor="middle" font-size="10" fill="#D1D5DB">feedback_pr_style.md</text>
  <text x="745" y="391" text-anchor="middle" font-size="8" fill="#D1D5DB">NOT selected</text>

  <!-- Key insight -->
  <rect x="635" y="415" width="220" height="42" rx="6" fill="#FEF2F2" stroke="#FECACA" stroke-width="1"/>
  <text x="745" y="435" text-anchor="middle" font-size="9" font-weight="600" fill="#DC2626">Precision over Recall</text>
  <text x="745" y="449" text-anchor="middle" font-size="8" fill="#6B7280">Wrong memory = context pollution</text>

  <!-- Arrows -->
  <line x1="265" y1="200" x2="320" y2="230" stroke="#4F46E5" stroke-width="1.5" marker-end="url(#a1)"/>
  <line x1="575" y1="355" x2="630" y2="140" stroke="#16A34A" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="575" y1="355" x2="630" y2="210" stroke="#DC2626" stroke-width="1" stroke-dasharray="4" marker-end="url(#a3)"/>
  <line x1="575" y1="355" x2="630" y2="265" stroke="#DC2626" stroke-width="1" stroke-dasharray="4"/>
  <line x1="575" y1="355" x2="630" y2="320" stroke="#DC2626" stroke-width="1" stroke-dasharray="4"/>
  <line x1="575" y1="355" x2="630" y2="375" stroke="#DC2626" stroke-width="1" stroke-dasharray="4"/>
</svg>