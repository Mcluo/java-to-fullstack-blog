<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="tuiGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="mcpGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#f97316"/>
    </linearGradient>
    <linearGradient id="tmuxGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="gitGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
    <linearGradient id="dbGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="100%" style="stop-color:#db2777"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="520" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="40" text-anchor="middle" fill="#e2e8f0" font-size="18" font-weight="700">agtx Architecture</text>

  <!-- TUI Layer -->
  <rect x="60" y="60" width="680" height="70" rx="10" fill="url(#tuiGrad)" opacity="0.9" filter="url(#shadow)"/>
  <text x="400" y="88" text-anchor="middle" fill="white" font-size="15" font-weight="600">agtx TUI (ratatui)</text>
  <text x="400" y="115" text-anchor="middle" fill="#e0e7ff" font-size="11">Kanban Board: Backlog | Planning | Running | Review | Done</text>

  <!-- Orchestrator -->
  <rect x="540" y="160" width="200" height="60" rx="10" fill="url(#mcpGrad)" opacity="0.9" filter="url(#shadow)"/>
  <text x="640" y="185" text-anchor="middle" fill="white" font-size="13" font-weight="600">Orchestrator Agent</text>
  <text x="640" y="205" text-anchor="middle" fill="#fef3c7" font-size="10">(Claude Code via MCP)</text>

  <!-- MCP Server -->
  <rect x="540" y="240" width="200" height="50" rx="10" fill="none" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="640" y="262" text-anchor="middle" fill="#fbbf24" font-size="12">MCP Server (stdio)</text>
  <text x="640" y="278" text-anchor="middle" fill="#78716c" font-size="9">JSON-RPC</text>

  <!-- Arrow: TUI -> Orchestrator -->
  <line x1="640" y1="130" x2="640" y2="160" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)"/>
  <!-- Arrow: Orchestrator <-> MCP -->
  <line x1="640" y1="220" x2="640" y2="240" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- tmux Layer -->
  <rect x="60" y="160" width="440" height="140" rx="10" fill="url(#tmuxGrad)" opacity="0.15" stroke="#10b981" stroke-width="1"/>
  <text x="280" y="182" text-anchor="middle" fill="#34d399" font-size="13" font-weight="600">tmux server "agtx"</text>

  <!-- tmux windows -->
  <rect x="80" y="195" width="120" height="90" rx="6" fill="#064e3b" opacity="0.8"/>
  <text x="140" y="215" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="500">Task A</text>
  <text x="140" y="232" text-anchor="middle" fill="#a7f3d0" font-size="9">Claude Code</text>
  <rect x="95" y="242" width="90" height="32" rx="4" fill="#022c22" opacity="0.8"/>
  <text x="140" y="262" text-anchor="middle" fill="#34d399" font-size="9" font-family="monospace">> coding...</text>

  <rect x="220" y="195" width="120" height="90" rx="6" fill="#064e3b" opacity="0.8"/>
  <text x="280" y="215" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="500">Task B</text>
  <text x="280" y="232" text-anchor="middle" fill="#a7f3d0" font-size="9">Gemini CLI</text>
  <rect x="235" y="242" width="90" height="32" rx="4" fill="#022c22" opacity="0.8"/>
  <text x="280" y="262" text-anchor="middle" fill="#34d399" font-size="9" font-family="monospace">> research</text>

  <rect x="360" y="195" width="120" height="90" rx="6" fill="#064e3b" opacity="0.8"/>
  <text x="420" y="215" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="500">Task C</text>
  <text x="420" y="232" text-anchor="middle" fill="#a7f3d0" font-size="9">Codex</text>
  <rect x="375" y="242" width="90" height="32" rx="4" fill="#022c22" opacity="0.8"/>
  <text x="420" y="262" text-anchor="middle" fill="#34d399" font-size="9" font-family="monospace">> review</text>

  <!-- Git Worktrees -->
  <rect x="60" y="330" width="440" height="80" rx="10" fill="url(#gitGrad)" opacity="0.15" stroke="#3b82f6" stroke-width="1"/>
  <text x="280" y="352" text-anchor="middle" fill="#60a5fa" font-size="13" font-weight="600">Git Worktrees (isolated)</text>

  <rect x="80" y="362" width="120" height="35" rx="5" fill="#1e3a5f" opacity="0.8"/>
  <text x="140" y="384" text-anchor="middle" fill="#93c5fd" font-size="10">.agtx/wt/task-a/</text>

  <rect x="220" y="362" width="120" height="35" rx="5" fill="#1e3a5f" opacity="0.8"/>
  <text x="280" y="384" text-anchor="middle" fill="#93c5fd" font-size="10">.agtx/wt/task-b/</text>

  <rect x="360" y="362" width="120" height="35" rx="5" fill="#1e3a5f" opacity="0.8"/>
  <text x="420" y="384" text-anchor="middle" fill="#93c5fd" font-size="10">.agtx/wt/task-c/</text>

  <!-- Arrows: tmux -> git -->
  <line x1="140" y1="285" x2="140" y2="362" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="280" y1="285" x2="280" y2="362" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="420" y1="285" x2="420" y2="362" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- SQLite -->
  <rect x="540" y="330" width="200" height="80" rx="10" fill="url(#dbGrad)" opacity="0.15" stroke="#ec4899" stroke-width="1"/>
  <text x="640" y="358" text-anchor="middle" fill="#f472b6" font-size="13" font-weight="600">SQLite</text>
  <text x="640" y="378" text-anchor="middle" fill="#fda4af" font-size="10">Tasks, Projects, State</text>
  <text x="640" y="395" text-anchor="middle" fill="#78716c" font-size="9">~/Library/.../agtx/index.db</text>

  <!-- Arrow: MCP -> SQLite -->
  <line x1="640" y1="290" x2="640" y2="330" stroke="#ec4899" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- Arrows from TUI down -->
  <line x1="200" y1="130" x2="200" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="400" y1="130" x2="400" y2="160" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Legend -->
  <rect x="60" y="440" width="680" height="60" rx="8" fill="#1e293b" opacity="0.5"/>
  <circle cx="100" cy="465" r="6" fill="#8b5cf6"/>
  <text x="115" y="469" fill="#cbd5e1" font-size="10">TUI Layer</text>
  <circle cx="210" cy="465" r="6" fill="#10b981"/>
  <text x="225" y="469" fill="#cbd5e1" font-size="10">Agent Sessions</text>
  <circle cx="340" cy="465" r="6" fill="#3b82f6"/>
  <text x="355" y="469" fill="#cbd5e1" font-size="10">Code Isolation</text>
  <circle cx="460" cy="465" r="6" fill="#f59e0b"/>
  <text x="475" y="469" fill="#cbd5e1" font-size="10">Orchestration</text>
  <circle cx="590" cy="465" r="6" fill="#ec4899"/>
  <text x="605" y="469" fill="#cbd5e1" font-size="10">Persistence</text>

  <text x="400" y="495" text-anchor="middle" fill="#64748b" font-size="9">Each task = isolated worktree + dedicated tmux window + independent agent</text>
</svg>