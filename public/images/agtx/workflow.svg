<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif">
  <defs>
    <linearGradient id="wfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="wfShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <rect width="800" height="320" fill="url(#wfBg)" rx="12"/>

  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Multi-Agent Task Lifecycle</text>

  <!-- Phase boxes -->
  <!-- Backlog -->
  <rect x="30" y="65" width="130" height="110" rx="10" fill="#334155" filter="url(#wfShadow)"/>
  <rect x="30" y="65" width="130" height="30" rx="10" fill="#475569"/>
  <rect x="30" y="85" width="130" height="2" fill="#475569"/>
  <text x="95" y="86" text-anchor="middle" fill="#e2e8f0" font-size="13" font-weight="600">Backlog</text>
  <text x="95" y="115" text-anchor="middle" fill="#94a3b8" font-size="10">Define tasks</text>
  <text x="95" y="132" text-anchor="middle" fill="#94a3b8" font-size="10">Set priorities</text>
  <rect x="50" y="148" width="90" height="18" rx="4" fill="#1e293b"/>
  <text x="95" y="161" text-anchor="middle" fill="#64748b" font-size="9">Human</text>

  <!-- Arrow -->
  <line x1="160" y1="120" x2="185" y2="120" stroke="#6366f1" stroke-width="2"/>
  <polygon points="185,115 195,120 185,125" fill="#6366f1"/>

  <!-- Research -->
  <rect x="195" y="65" width="130" height="110" rx="10" fill="#1e1b4b" filter="url(#wfShadow)" stroke="#6366f1" stroke-width="1"/>
  <rect x="195" y="65" width="130" height="30" rx="10" fill="#312e81"/>
  <rect x="195" y="85" width="130" height="2" fill="#312e81"/>
  <text x="260" y="86" text-anchor="middle" fill="#c7d2fe" font-size="13" font-weight="600">Research</text>
  <text x="260" y="115" text-anchor="middle" fill="#a5b4fc" font-size="10">Context gathering</text>
  <text x="260" y="132" text-anchor="middle" fill="#a5b4fc" font-size="10">Codebase analysis</text>
  <rect x="215" y="148" width="90" height="18" rx="4" fill="#4338ca"/>
  <text x="260" y="161" text-anchor="middle" fill="#e0e7ff" font-size="9" font-weight="500">Gemini</text>

  <!-- Arrow -->
  <line x1="325" y1="120" x2="350" y2="120" stroke="#8b5cf6" stroke-width="2"/>
  <polygon points="350,115 360,120 350,125" fill="#8b5cf6"/>

  <!-- Planning -->
  <rect x="360" y="65" width="130" height="110" rx="10" fill="#1e1b4b" filter="url(#wfShadow)" stroke="#8b5cf6" stroke-width="1"/>
  <rect x="360" y="65" width="130" height="30" rx="10" fill="#4c1d95"/>
  <rect x="360" y="85" width="130" height="2" fill="#4c1d95"/>
  <text x="425" y="86" text-anchor="middle" fill="#ddd6fe" font-size="13" font-weight="600">Planning</text>
  <text x="425" y="115" text-anchor="middle" fill="#c4b5fd" font-size="10">Spec generation</text>
  <text x="425" y="132" text-anchor="middle" fill="#c4b5fd" font-size="10">Task breakdown</text>
  <rect x="380" y="148" width="90" height="18" rx="4" fill="#6d28d9"/>
  <text x="425" y="161" text-anchor="middle" fill="#ede9fe" font-size="9" font-weight="500">Claude</text>

  <!-- Arrow -->
  <line x1="490" y1="120" x2="515" y2="120" stroke="#a78bfa" stroke-width="2"/>
  <polygon points="515,115 525,120 515,125" fill="#a78bfa"/>

  <!-- Running -->
  <rect x="525" y="65" width="130" height="110" rx="10" fill="#0c4a1f" filter="url(#wfShadow)" stroke="#22c55e" stroke-width="1"/>
  <rect x="525" y="65" width="130" height="30" rx="10" fill="#166534"/>
  <rect x="525" y="85" width="130" height="2" fill="#166534"/>
  <text x="590" y="86" text-anchor="middle" fill="#bbf7d0" font-size="13" font-weight="600">Running</text>
  <text x="590" y="115" text-anchor="middle" fill="#86efac" font-size="10">Implementation</text>
  <text x="590" y="132" text-anchor="middle" fill="#86efac" font-size="10">Code generation</text>
  <rect x="545" y="148" width="90" height="18" rx="4" fill="#15803d"/>
  <text x="590" y="161" text-anchor="middle" fill="#dcfce7" font-size="9" font-weight="500">Claude</text>

  <!-- Arrow -->
  <line x1="655" y1="120" x2="680" y2="120" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="680,115 690,120 680,125" fill="#f59e0b"/>

  <!-- Review -->
  <rect x="690" y="65" width="90" height="110" rx="10" fill="#451a03" filter="url(#wfShadow)" stroke="#f59e0b" stroke-width="1"/>
  <rect x="690" y="65" width="90" height="30" rx="10" fill="#78350f"/>
  <rect x="690" y="85" width="90" height="2" fill="#78350f"/>
  <text x="735" y="86" text-anchor="middle" fill="#fde68a" font-size="13" font-weight="600">Review</text>
  <text x="735" y="115" text-anchor="middle" fill="#fcd34d" font-size="10">Code review</text>
  <text x="735" y="132" text-anchor="middle" fill="#fcd34d" font-size="10">Conflict check</text>
  <rect x="700" y="148" width="70" height="18" rx="4" fill="#b45309"/>
  <text x="735" y="161" text-anchor="middle" fill="#fef3c7" font-size="9" font-weight="500">Codex</text>

  <!-- Orchestrator bar -->
  <rect x="195" y="200" width="585" height="45" rx="8" fill="#422006" opacity="0.6" stroke="#f59e0b" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="260" y="222" text-anchor="middle" fill="#fbbf24" font-size="11" font-weight="600">Orchestrator Agent</text>
  <text x="260" y="237" text-anchor="middle" fill="#92400e" font-size="9">(autonomous)</text>

  <!-- Orchestrator arrows up -->
  <line x1="260" y1="200" x2="260" y2="175" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="425" y1="200" x2="425" y2="175" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="590" y1="200" x2="590" y2="175" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>
  <line x1="735" y1="200" x2="735" y2="175" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>

  <!-- Orchestrator actions -->
  <text x="425" y="222" fill="#fcd34d" font-size="9">monitors progress</text>
  <text x="560" y="222" fill="#fcd34d" font-size="9">|</text>
  <text x="640" y="222" fill="#fcd34d" font-size="9">auto-advances phases</text>
  <text x="425" y="237" fill="#92400e" font-size="9">detects stuck tasks</text>
  <text x="560" y="237" fill="#92400e" font-size="9">|</text>
  <text x="640" y="237" fill="#92400e" font-size="9">resolves conflicts</text>

  <!-- Bottom note -->
  <rect x="60" y="265" width="680" height="40" rx="6" fill="#1e293b" opacity="0.5"/>
  <text x="400" y="282" text-anchor="middle" fill="#94a3b8" font-size="10">Each phase can use a different AI agent | Automatic session switching | Context preserved across phases</text>
  <text x="400" y="296" text-anchor="middle" fill="#64748b" font-size="9">Human only needed for: task definition (Backlog) and final merge (after Review)</text>
</svg>