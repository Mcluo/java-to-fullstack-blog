<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" font-family="'SF Pro Display', 'Inter', -apple-system, sans-serif">
  <defs>
    <linearGradient id="pBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <filter id="pShadow">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="360" fill="url(#pBg)" rx="12"/>
  <text x="400" y="35" text-anchor="middle" fill="#e2e8f0" font-size="16" font-weight="700">Plugin Ecosystem &amp; Agent Compatibility</text>

  <!-- Plugin cards -->
  <!-- void -->
  <rect x="30" y="60" width="100" height="80" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1" filter="url(#pShadow)"/>
  <text x="80" y="82" text-anchor="middle" fill="#94a3b8" font-size="12" font-weight="600">void</text>
  <text x="80" y="100" text-anchor="middle" fill="#64748b" font-size="8">Plain session</text>
  <text x="80" y="115" text-anchor="middle" fill="#64748b" font-size="8">Full human control</text>
  <text x="80" y="132" text-anchor="middle" fill="#475569" font-size="7">No automation</text>

  <!-- agtx -->
  <rect x="140" y="60" width="100" height="80" rx="8" fill="#312e81" stroke="#6366f1" stroke-width="1.5" filter="url(#pShadow)"/>
  <text x="190" y="82" text-anchor="middle" fill="#c7d2fe" font-size="12" font-weight="600">agtx</text>
  <text x="190" y="100" text-anchor="middle" fill="#a5b4fc" font-size="8">Built-in workflow</text>
  <text x="190" y="115" text-anchor="middle" fill="#a5b4fc" font-size="8">Skills per phase</text>
  <rect x="155" y="125" width="70" height="12" rx="3" fill="#4f46e5"/>
  <text x="190" y="134" text-anchor="middle" fill="#e0e7ff" font-size="7">DEFAULT</text>

  <!-- gsd -->
  <rect x="250" y="60" width="100" height="80" rx="8" fill="#1e293b" stroke="#22c55e" stroke-width="1" filter="url(#pShadow)"/>
  <text x="300" y="82" text-anchor="middle" fill="#86efac" font-size="12" font-weight="600">gsd</text>
  <text x="300" y="100" text-anchor="middle" fill="#6ee7b7" font-size="8">Get Shit Done</text>
  <text x="300" y="115" text-anchor="middle" fill="#6ee7b7" font-size="8">Interactive planning</text>
  <text x="300" y="132" text-anchor="middle" fill="#475569" font-size="7">Spec-driven</text>

  <!-- spec-kit -->
  <rect x="360" y="60" width="100" height="80" rx="8" fill="#1e293b" stroke="#3b82f6" stroke-width="1" filter="url(#pShadow)"/>
  <text x="410" y="82" text-anchor="middle" fill="#93c5fd" font-size="12" font-weight="600">spec-kit</text>
  <text x="410" y="100" text-anchor="middle" fill="#60a5fa" font-size="8">GitHub SDD</text>
  <text x="410" y="115" text-anchor="middle" fill="#60a5fa" font-size="8">Specs as artifacts</text>
  <text x="410" y="132" text-anchor="middle" fill="#475569" font-size="7">Executable</text>

  <!-- openspec -->
  <rect x="470" y="60" width="100" height="80" rx="8" fill="#1e293b" stroke="#a78bfa" stroke-width="1" filter="url(#pShadow)"/>
  <text x="520" y="82" text-anchor="middle" fill="#c4b5fd" font-size="12" font-weight="600">openspec</text>
  <text x="520" y="100" text-anchor="middle" fill="#a78bfa" font-size="8">AI-guided spec</text>
  <text x="520" y="115" text-anchor="middle" fill="#a78bfa" font-size="8">Lightweight</text>
  <text x="520" y="132" text-anchor="middle" fill="#475569" font-size="7">Fast prototyping</text>

  <!-- bmad -->
  <rect x="580" y="60" width="100" height="80" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1" filter="url(#pShadow)"/>
  <text x="630" y="82" text-anchor="middle" fill="#f9a8d4" font-size="12" font-weight="600">bmad</text>
  <text x="630" y="100" text-anchor="middle" fill="#f472b6" font-size="8">AI Agile Dev</text>
  <text x="630" y="115" text-anchor="middle" fill="#f472b6" font-size="8">Structured phases</text>
  <text x="630" y="132" text-anchor="middle" fill="#475569" font-size="7">Enterprise</text>

  <!-- superpowers -->
  <rect x="690" y="60" width="90" height="80" rx="8" fill="#1e293b" stroke="#fbbf24" stroke-width="1" filter="url(#pShadow)"/>
  <text x="735" y="82" text-anchor="middle" fill="#fde68a" font-size="11" font-weight="600">superpowers</text>
  <text x="735" y="100" text-anchor="middle" fill="#fcd34d" font-size="8">TDD + subagent</text>
  <text x="735" y="115" text-anchor="middle" fill="#fcd34d" font-size="8">Brainstorming</text>
  <text x="735" y="132" text-anchor="middle" fill="#475569" font-size="7">Claude only</text>

