  <text x="640" y="317" text-anchor="middle" fill="#fbbf24" font-size="10">~</text>
  <text x="720" y="317" text-anchor="middle" fill="#ef4444" font-size="12">&#x2717;</text>

  <!-- Legend -->
  <text x="250" y="348" fill="#22c55e" font-size="9">&#x2713; Full support</text>
  <text x="380" y="348" fill="#fbbf24" font-size="9">~ Prompt only</text>
