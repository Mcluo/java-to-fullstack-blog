  <!-- Header row -->
  <text x="180" y="198" text-anchor="end" fill="#94a3b8" font-size="10" font-weight="500">Agent</text>
  <text x="250" y="198" text-anchor="middle" fill="#94a3b8" font-size="10">void</text>
  <text x="330" y="198" text-anchor="middle" fill="#94a3b8" font-size="10">agtx</text>
  <text x="410" y="198" text-anchor="middle" fill="#94a3b8" font-size="10">gsd</text>
  <text x="490" y="198" text-anchor="middle" fill="#94a3b8" font-size="10">spec-kit</text>
  <text x="570" y="198" text-anchor="middle" fill="#94a3b8" font-size="10">openspec</text>
  <text x="640" y="198" text-anchor="middle" fill="#94a3b8" font-size="10">bmad</text>
  <text x="720" y="198" text-anchor="middle" fill="#94a3b8" font-size="10">super</text>

  <line x1="195" y1="205" x2="760" y2="205" stroke="#334155" stroke-width="1"/>

  <!-- Claude row -->
