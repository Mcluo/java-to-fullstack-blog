  <!-- Copilot row -->
  <text x="180" y="317" text-anchor="end" fill="#c7d2fe" font-size="10">Copilot</text>
  <text x="250" y="317" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
  <text x="330" y="317" text-anchor="middle" fill="#fbbf24" font-size="10">~</text>
  <text x="410" y="317" text-anchor="middle" fill="#ef4444" font-size="12">&#x2717;</text>
