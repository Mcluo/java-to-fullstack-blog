  <text x="250" y="225" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
  <text x="330" y="225" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
  <text x="410" y="225" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
