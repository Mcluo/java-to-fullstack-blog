  <text x="180" y="248" text-anchor="end" fill="#c7d2fe" font-size="10">Codex</text>
  <text x="250" y="248" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
  <text x="330" y="248" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
  <text x="410" y="248" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
  <text x="490" y="248" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
  <text x="570" y="248" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
  <text x="640" y="248" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
  <text x="720" y="248" text-anchor="middle" fill="#ef4444" font-size="12">&#x2717;</text>

  <!-- Gemini row -->
  <text x="180" y="271" text-anchor="end" fill="#c7d2fe" font-size="10">Gemini CLI</text>
  <text x="250" y="271" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
  <text x="330" y="271" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
