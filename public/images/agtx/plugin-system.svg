  <text x="570" y="225" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
  <text x="640" y="225" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>
  <text x="720" y="225" text-anchor="middle" fill="#22c55e" font-size="12">&#x2713;</text>

